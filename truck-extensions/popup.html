<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Truck Route Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      width: 420px;
    }

    button {
      margin-bottom: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }

    textarea,
    input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
    }

    textarea {
      min-height: 160px;
    }
  </style>
</head>
<body>
  <h3>Truck Route Calculator</h3>

  <button id="takeTimocomOfferBtn">
    Take selected TIMOCOM offer
  </button>

   <textarea
      id="timocomDebugText"
      placeholder="TIMOCOM debug text"
  ></textarea>

  <label>Truck location</label>
  <input id="truck_location" placeholder="truck_location" />

  <label>Loading</label>
  <input id="loading" placeholder="loading" />

  <label>Unloading</label>
  <input id="unloading" placeholder="unloading" />

  <label>Price</label>
<input id="price" placeholder="price" />
<button id="calculateBtn">
  Analyze route
</button>
  <div id="result"></div>
<a href="${mapsUrl}" target="_blank" class="maps-link">
  🗺️ Open route in Google Maps
</a>
  <script src="popup.js"></script>
</body>
</html>
